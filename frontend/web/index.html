<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>replicate-safe</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='black'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span>replicate-safe</span>
      </div>
      <div class="spacer"></div>
      <div class="search">
        <input id="filter" type="search" placeholder="search metadata, prompts, models…" autocomplete="off" />
      </div>
      <div class="preview-size" title="thumbnail size in file explorer">
        <label for="size">thumbs</label>
        <input id="size" type="range" min="20" max="100" step="2" value="48" />
        <span id="size-val">48px</span>
      </div>
      <div class="actions">
        <button id="refresh" title="Refresh listing">↻</button>
        <button id="theme" title="Toggle theme">◐</button>
      </div>
    </header>

    <main class="split" id="split">
      <aside class="pane left">
        <div class="list-header" id="list-header">
          <span class="col-thumb" data-sort=""></span>
          <span class="col-name" data-sort="filename">file</span>
          <span class="col-created" data-sort="created_at">created</span>
          <span class="col-model" data-sort="model">model</span>
          <span class="col-status" data-sort="status">status</span>
          <span class="col-time" data-sort="time_to_make">time</span>
          <span class="col-size" data-sort="size">size</span>
        </div>
        <ul id="list" class="list" tabindex="0" aria-label="Predictions"></ul>
        <div id="empty" class="empty" hidden>no predictions yet</div>
      </aside>
      <div class="resizer resizer-x" id="split-resizer" role="separator" aria-orientation="vertical" aria-label="Resize panels"></div>

      <section class="pane right">
        <div id="toolbar" class="toolbar" hidden>
          <a id="download-btn" class="btn" href="#" download>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Download</span>
          </a>
          <span class="toolbar-divider" data-show-when="image"></span>
          <label class="toolbar-label" data-show-when="image" for="convert-to">Convert to:</label>
          <select id="convert-to" class="convert-select" data-show-when="image">
            <option value="">— pick format —</option>
            <option value="jpg">JPG</option>
            <option value="png">PNG</option>
            <option value="gif">GIF</option>
            <option value="bmp">BMP</option>
            <option value="tiff">TIFF</option>
          </select>
          <span class="toolbar-divider"></span>
          <a id="share-telegram" class="btn btn-icon" target="_blank" rel="noopener" title="Share to Telegram" aria-label="Share to Telegram">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.24 3.64 11.95c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71l-4.13-3.05-1.99 1.93c-.23.23-.42.42-.86.42z"/></svg>
          </a>
          <a id="share-whatsapp" class="btn btn-icon" target="_blank" rel="noopener" title="Share to WhatsApp" aria-label="Share to WhatsApp">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1s-.5-.1-.7.1-.8 1-1 1.2-.4.2-.7.1c-.3-.1-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.4.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.1-.6-1.6-.9-2.2-.2-.5-.5-.5-.6-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.2-.6-.4zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.4c1.4.8 3 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18c-1.5 0-3-.4-4.3-1.2l-.3-.2-3.2.8.9-3.1-.2-.3C4.3 14.7 4 13.4 4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8z"/></svg>
          </a>
          <button id="copy-link" class="btn btn-icon" type="button" title="Copy link to clipboard" aria-label="Copy link">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          </button>
          <button id="copy-image" class="btn btn-icon" type="button" title="Copy image to clipboard" aria-label="Copy image" data-show-when="image">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
        </div>
        <div id="preview" class="preview idle">
          <p>Select a file on the left to preview.</p>
        </div>
        <div class="zoom-controls" id="zoom-controls" hidden role="toolbar" aria-label="Zoom controls">
          <button class="btn btn-icon" type="button" id="zoom-out" title="Zoom out (-)" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <span class="zoom-val" id="zoom-val">100%</span>
          <button class="btn btn-icon" type="button" id="zoom-in" title="Zoom in (+)" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <button class="btn btn-icon" type="button" id="zoom-reset" title="Reset zoom (0)" aria-label="Reset zoom">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          </button>
        </div>
        <div class="meta-handle" id="meta-handle" hidden aria-label="Resize metadata"></div>
        <details id="meta" class="meta" hidden>
          <summary>metadata.json</summary>
          <pre id="meta-content"></pre>
        </details>
      </section>
    </main>

    <footer class="footer">
      <span class="credit">Made with <span class="heart">&lt;3</span> by NopeNix</span>
      <span class="spacer"></span>
      <a class="icon" href="https://github.com/NopeNix/Replicate-Safe" target="_blank" rel="noopener" title="Source on GitHub" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.18c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.07 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.6.23 2.78.11 3.07.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.26 5.68.41.36.78 1.07.78 2.16v3.2c0 .31.21.68.8.56C20.21 21.38 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5Z"/></svg>
      </a>
      <a class="icon" href="https://hub.docker.com/r/nopenix/replicate-safe" target="_blank" rel="noopener" title="Image on Docker Hub" aria-label="Docker Hub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.98 11.13c-.04.14-.18.23-.32.18-.14-.04-.23-.18-.18-.32.04-.14.18-.23.32-.18.13.05.22.19.18.32zm-.21-.8c-.36.4-.97.51-1.43.27-.32-.17-.51-.5-.55-.88-.04-.31.05-.6.21-.83.18-.27.49-.43.81-.45.34-.02.68.12.89.39.42.55.34 1.34-.21 1.76l.28-.26zm-2.49 1.27c-.04.14-.18.23-.32.18-.14-.04-.23-.18-.18-.32.04-.14.18-.23.32-.18.13.05.22.19.18.32zm-.21-.8c-.36.4-.97.51-1.43.27-.32-.17-.51-.5-.55-.88-.04-.31.05-.6.21-.83.18-.27.49-.43.81-.45.34-.02.68.12.89.39.42.55.34 1.34-.21 1.76l.28-.26zm-1.68 1.16c-.02.09-.11.14-.2.12-.09-.02-.14-.11-.12-.2.02-.09.11-.14.2-.12.09.02.14.11.12.2zm-.13-.5c-.23.25-.6.32-.89.17-.2-.1-.32-.31-.34-.55-.03-.19.03-.37.13-.51.11-.17.3-.27.5-.28.21-.01.42.07.55.24.26.34.21.83-.13 1.09l.18-.16zm9.9 2.13c-.31-.32-.7-.5-1.13-.5H6.45c-.04 0-.07 0-.11.01-.4.04-.77.21-1.04.5-.36.39-.5.94-.36 1.47.27 1.06 1.36 2.39 4.04 2.79 1.42.21 2.78.31 4.06.31 1.94 0 3.7-.27 5.27-.79 2.41-.79 3.07-2.16 3.07-3.06 0-.27-.07-.51-.22-.73zM3.5 9.7l1.13.94.05.04-.96 1.04-.04-.04-1.18-.94V9.7zm2.27-1.4l1.22.86.04.04-.96 1.04-.05-.04-1.27-.86V8.3zm2.27-1.31l1.27.86.05.04-.96 1.04-.05-.04-1.31-.86V6.99zm2.27 2.18v1.18h-.05l-1.31-.95-.04-.04.96-1.04.05.04 1.39.81zm-3.31.27l-.96 1.04-.04-.04-1.18-.86v-1.18l1.13.86.05.04 1-.86zm0-2.18l-.96 1.04-.05-.04-1.22-.86V6.36l1.18.81.05.04 1-.95zm2.22-.18l-.96 1.04-.04-.04-1.27-.86V5.95l1.22.81.05.04 1-1z"/></svg>
      </a>
    </footer>

    <script src="/app.js" defer></script>
  </body>
</html>
